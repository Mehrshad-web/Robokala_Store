<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پرداخت ناموفق — RoboKala</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0d1117; color: #e6edf3;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            direction: rtl; padding: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px; padding: 48px 40px;
            text-align: center; max-width: 440px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }
        .icon-wrap {
            width: 90px; height: 90px; border-radius: 50%;
            background: rgba(248,81,73,.1);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
            animation: pop .4s ease;
        }
        @keyframes pop {
            0%   { transform: scale(.6); opacity: 0; }
            80%  { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .icon-wrap i { font-size: 46px; color: #f85149; }
        h1 { font-size: 22px; margin-bottom: 10px; color: #f85149; }
        .sub { font-size: 14px; color: #8b949e; margin-bottom: 12px; }
        .reason-box {
            background: rgba(248,81,73,.07);
            border: 1px solid rgba(248,81,73,.15);
            border-radius: 10px; padding: 12px 16px;
            font-size: 13px; color: #f85149; margin-bottom: 28px;
            display: none;
        }
        .btns { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .btn-retry {
            display: inline-flex; align-items: center; gap: 8px;
            background: #00d4ff; color: #000;
            padding: 12px 28px; border-radius: 10px;
            text-decoration: none; font-weight: 700;
            font-size: 14px; transition: opacity .2s;
        }
        .btn-retry:hover { opacity: .85; }
        .btn-home {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,.06); color: #e6edf3;
            padding: 10px 22px; border-radius: 10px;
            text-decoration: none; font-size: 13px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-wrap">
        <i class="ti ti-circle-x-filled"></i>
    </div>
    <h1>پرداخت ناموفق بود</h1>
    <p class="sub">متأسفانه پرداخت شما تکمیل نشد.</p>

    <div class="reason-box" id="reasonBox"></div>

    <p style="font-size:12px;color:#8b949e;margin-bottom:24px">
        مبلغی از حساب شما کسر نشده. می‌تونی دوباره تلاش کنی.
    </p>

    <div class="btns">
        <a href="/shopping-cart.html" class="btn-retry">
            <i class="ti ti-rotate-clockwise"></i> بازگشت به سبد خرید
        </a>
        <a href="/" class="btn-home">
            <i class="ti ti-home"></i> صفحه اصلی
        </a>
    </div>
</div>

<script>
    const p = new URLSearchParams(window.location.search);
    const reason = p.get('reason');
    const reasonBox = document.getElementById('reasonBox');
    const reasons = {
        cancelled:    'پرداخت توسط شما لغو شد.',
        not_found:    'سفارش مرتبط پیدا نشد.',
        server_error: 'خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.'
    };
    if (reason && reasons[reason]) {
        reasonBox.textContent = reasons[reason];
        reasonBox.style.display = 'block';
    }
</script>
</body>
</html>
