<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه پیدا نشد — RoboKala</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #eef0fb;
            background-image: radial-gradient(rgba(109,91,255,.25) 1.4px, transparent 1.4px);
            background-size: 22px 22px;
            display: flex; align-items: center; justify-content: center;
            direction: rtl; padding: 20px;
        }
        .card {
            background: rgba(255,255,255,.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(109,91,255,.15);
            border-radius: 24px;
            padding: 48px 42px;
            text-align: center;
            max-width: 460px; width: 100%;
            box-shadow: 0 20px 50px rgba(79,59,214,.12);
        }
        .code {
            font-size: 72px; font-weight: 800; line-height: 1;
            background: linear-gradient(135deg,#6d5bff,#4f3bd6);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 8px;
        }
        .icon-wrap {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(109,91,255,.12);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .icon-wrap i { font-size: 34px; color: #6d5bff; }
        h1 { font-size: 19px; color: #2c2a4a; margin-bottom: 8px; }
        p { font-size: 14px; color: #6b688a; margin-bottom: 28px; line-height: 1.8; }
        .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 11px 24px; border-radius: 12px;
            text-decoration: none; font-size: 13px; font-weight: 700;
            transition: opacity .2s;
        }
        .btn:hover { opacity: .85; }
        .btn-primary { background: linear-gradient(135deg,#6d5bff,#4f3bd6); color: #fff; }
        .btn-secondary { background: rgba(109,91,255,.1); color: #4f3bd6; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap"><i class="ti ti-map-search"></i></div>
        <div class="code">404</div>
        <h1>این صفحه پیدا نشد</h1>
        <p>لینکی که دنبالش بودی یا اشتباهه یا دیگه وجود نداره.<br>نگران نباش، بریم یه جای درست‌تر 👇</p>
        <div class="btns">
            <a href="/" class="btn btn-primary"><i class="ti ti-home"></i> صفحه اصلی</a>
            <a href="/products-explore.html" class="btn btn-secondary"><i class="ti ti-shopping-bag"></i> مشاهده محصولات</a>
        </div>
    </div>
</body>
</html>
